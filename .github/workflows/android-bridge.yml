name: Build Android bridge
on:
  push:
    branches: [android-bridge-build]
    paths:
      - 'android-bridge/src/**'
      - 'android-bridge/res/**'
      - 'android-bridge/AndroidManifest.xml'
      - 'android-bridge/build-ci.sh'
      - '.github/workflows/android-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-bridge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          sparse-checkout: android-bridge
      - name: Select installed Java and Android SDK
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile unsigned diagnostic APK
        shell: bash
        run: bash android-bridge/build-ci.sh
      - name: Keep APK and verification metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bunjang-bridge-0.1-unsigned
          path: android-bridge/artifacts/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
